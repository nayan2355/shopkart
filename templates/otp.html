<!DOCTYPE html>
<html>
<head><meta name="viewport" content="width=device-width, initial-scale=1.0"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><title>Enter OTP</title></head>
<body style="background:white;">
<div style="max-width:400px; margin:0 auto; padding:20px;">
<h4 class="text-center mt-5 fw-bold">Enter OTP</h4>
<p class="text-center text-muted">OTP sent to +91 {{ phone }} (Demo OTP: 123456)</p>
<form action="/verify_otp" method="POST" class="mt-4">
<input type="number" name="otp" required placeholder="123456" style="border:1.5px solid #0d6efd; border-radius:12px; padding:14px; width:100%; text-align:center; font-size:22px; letter-spacing:5px;" autofocus>
<button type="submit" style="background:#0d6efd; color:white; border:none; width:100%; padding:14px; border-radius:12px; margin-top:15px; font-weight:bold;">Verify OTP</button>
</form>
</div>
</body>
</html>

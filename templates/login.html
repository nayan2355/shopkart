<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Goldify - Login</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<style>
body{background:white;}
.main-box{max-width:400px; margin:0 auto; padding:20px;}
.logo{color:#ff8c00; font-weight:bold; font-size:28px;}
.input-box{border:1.5px solid #ff8c00; border-radius:12px; padding:12px; display:flex;}
</style>
</head>
<body>
<div class="main-box">
<div style="display:flex; justify-content:space-between;">
<span class="logo">🪙 Goldify</span>
<a href="/" style="text-decoration:none; font-size:24px; color:black;">✕</a>
</div>
<h4 class="text-center mt-5 fw-bold">Log in or Sign up</h4>

<div id="phoneDiv">
<div class="input-box mt-4">
<span>+91</span>
<input type="number" id="phoneNumber" style="border:none; outline:none; width:100%; margin-left:10px;" placeholder="Enter mobile number">
</div>
<div id="recaptcha-container" class="mt-3"></div>
<button onclick="sendOTP()" id="sendBtn" style="background:#ff8c00; color:white; border:none; width:100%; padding:14px; border-radius:12px; margin-top:15px; font-weight:bold;">Log in using OTP</button>
</div>

<div id="otpDiv" style="display:none;">
<p class="text-center mt-4">OTP sent to <span id="phoneDisplay" style="font-weight:bold;"></span></p>
<input type="number" id="otpCode" placeholder="123456" style="border:1.5px solid #ff8c00; border-radius:12px; padding:14px; width:100%; text-align:center; font-size:22px; letter-spacing:5px;">
<button onclick="verifyOTP()" style="background:#0d6efd; color:white; border:none; width:100%; padding:14px; border-radius:12px; margin-top:15px; font-weight:bold;">Verify OTP</button>
<p class="text-center mt-3" onclick="location.reload()" style="color:#ff8c00; cursor:pointer;">Change number?</p>
</div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyC2WYz-Y7gmpTyk6Y_7DBM2n6AzbHzmlAU",
  authDomain: "goldify-cda3d.firebaseapp.com",
  projectId: "goldify-cda3d",
  storageBucket: "goldify-cda3d.firebasestorage.app",
  messagingSenderId: "336933650438",
  appId: "1:336933650438:web:52851f1b77eb7496b1c387"
};

firebase.initializeApp(firebaseConfig);
window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', {'size': 'normal'});
let confirmationResult;

function sendOTP() {
  let phone = document.getElementById('phoneNumber').value;
  if(phone.length < 10){ alert("Sahi 10 digit number dalo!"); return; }
  document.getElementById('sendBtn').innerText = "Sending...";
  let appVerifier = window.recaptchaVerifier;
  firebase.auth().signInWithPhoneNumber("+91"+phone, appVerifier)
    .then((result) => {
      confirmationResult = result;
      document.getElementById('phoneDiv').style.display='none';
      document.getElementById('otpDiv').style.display='block';
      document.getElementById('phoneDisplay').innerText = "+91"+phone;
    }).catch((error) => { 
      alert(error.message); 
      document.getElementById('sendBtn').innerText = "Log in using OTP";
    });
}

function verifyOTP() {
  let code = document.getElementById('otpCode').value;
  if(code.length < 6){ alert("6 digit OTP dalo!"); return; }
  confirmationResult.confirm(code).then((result) => {
    let phone = document.getElementById('phoneNumber').value;
    window.location.href = "/set_login?phone=" + phone;
  }).catch((error) => { alert("Galat OTP! Sahi OTP check karo."); });
}
</script>
</body>
</html>

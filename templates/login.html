<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Goldify - Login</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background:white;">
<div style="max-width:400px; margin:0 auto; padding:20px;">
<div style="display:flex; justify-content:space-between;">
<span style="color:#ff8c00; font-weight:bold; font-size:28px;">🪙 Goldify</span>
<a href="/" style="text-decoration:none; font-size:24px; color:black;">✕</a>
</div>
<h4 class="text-center mt-5 fw-bold">Log in or Sign up</h4>
<form action="/login" method="POST" class="mt-4">
<div style="border:1.5px solid #ff8c00; border-radius:12px; padding:12px; display:flex;">
<span>+91</span>
<input type="number" name="phone" required style="border:none; outline:none; width:100%; margin-left:10px;" placeholder="Enter mobile number" autofocus>
</div>
<button type="submit" style="background:#9e9e9e; color:white; border:none; width:100%; padding:14px; border-radius:12px; margin-top:15px; font-weight:bold;">Log in using OTP</button>
</form>
<p style="font-size:12px; color:grey; text-align:center; margin-top:20px;">By continuing, I accept Terms & Conditions and Privacy Policy</p>
</div>
</body>
</html>

<!DOCTYPE html>
<html>
<head><meta name="viewport" content="width=device-width, initial-scale=1.0"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><title>Cart - Goldify</title></head>
<body style="background:#f1f3f6">
<nav class="navbar bg-primary navbar-dark"><div class="container"><a href="/" class="navbar-brand fw-bold">🪙 Goldify</a></div></nav>
<div class="container py-4">
<h3>Your Cart</h3>
{% if products %}{% for p in products %}<div class="card mb-2 p-2 d-flex flex-row align-items-center"><img src="{{p['image']}}" style="width:80px;height:80px;object-fit:contain"><div class="ms-3"><h6>{{p['name']}}</h6><b>₹{{p['price']}}</b></div></div>{% endfor %}<h4>Total: ₹{{total}}</h4><a href="/clear_cart" class="btn btn-danger">Clear Cart</a>{% else %}<p>Cart Khali Hai! <a href="/">Shopping Karo</a></p>{% endif %}
</div>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Goldify</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body{background:#f1f3f6}
.card:hover{transform:translateY(-5px);box-shadow:0 8px 20px rgba(0,0,0,0.15);transition:0.3s}
.product-img{height:200px;object-fit:contain;background:white;padding:10px}
</style>
</head>
<body>
<nav class="navbar bg-primary navbar-dark sticky-top">
<div class="container">
<a href="/" class="navbar-brand fw-bold fs-4">🪙 Goldify</a>
<a href="/cart" class="btn btn-warning fw-bold">Cart ({{ cart_count }})</a>
</div>
</nav>

<div class="container py-4">
<h4 class="mb-3">Best Deals For You</h4>
<div class="row g-3">
{% for p in products %}
<div class="col-6 col-md-4 col-lg-3">
<div class="card h-100 border-0 shadow-sm">
<img src="{{ p['image'] }}" class="product-img card-img-top">
<div class="card-body">
<h6 style="height:40px;overflow:hidden">{{ p['name'] }}</h6>
<p class="fw-bold text-success fs-5">₹{{ p['price'] }}</p>
<a href="/add_to_cart/{{ p['id'] }}" class="btn btn-primary w-100">Add to Cart</a>
</div>
</div>
</div>
{% endfor %}
</div>
</div>
</body>
</html>
